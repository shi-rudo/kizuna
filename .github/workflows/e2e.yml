
name: E2E Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-vite-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install

      - name: Build and pack kizuna
        run: |
          pnpm run build
          PKG_PATH=$(pnpm pack --json | jq -r '.filename')
          echo "PKG_FILE=$(basename "$PKG_PATH")" >> "$GITHUB_ENV"

      - name: Create test Vite app
        run: pnpm create vite test-app --template react-ts

      - name: Install kizuna in test app
        run: |
          mv "$PKG_FILE" test-app/
          cd test-app
          pnpm add "./$PKG_FILE"

      - name: Create test file
        run: cp -f tests/fixtures/package-consumer.ts test-app/src/test.ts

      - name: Check packed runtime exports
        run: |
          cd test-app
          node --input-type=module -e "import * as k from '@shirudo/kizuna'; const actual = Object.keys(k).sort(); const expected = ['CircularDependencyError','ContainerBuilder','DisposalError','ServiceProviderToken','interfaceToken']; if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error('Unexpected exports: ' + actual.join(','));"

      - name: Build test app
        run: cd test-app && pnpm run build
